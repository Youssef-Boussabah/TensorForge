[project]
name = "tensorforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Youssef Boussabah", email = "youssefboussabah2007@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The default .pytest_cache at the repo root and the shared temp dir
# %TEMP%/pytest-of-* both have broken permissions on this machine
# (access denied even to reads). Point pytest's cache and tmp_path
# base somewhere writable instead.
cache_dir = ".cache/pytest"
addopts = "--basetemp=.cache/pytest-tmp"
